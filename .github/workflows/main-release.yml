name: DuskBlade Main Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub prerelease after a successful build"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: duskblade-main-release
  cancel-in-progress: false

jobs:
  build:
    name: Build DuskBlade Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ------------------------------------------------------------
      # 2. Free disk space
      # ------------------------------------------------------------
      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "Disk before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          docker system prune -af || true

          echo "Disk after cleanup:"
          df -h

      # ------------------------------------------------------------
      # 3. Repository preflight
      # ------------------------------------------------------------
      - name: Repository preflight
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Unity version..."
          test -f ProjectSettings/ProjectVersion.txt
          grep -q "m_EditorVersion: 2022.3.62f3" ProjectSettings/ProjectVersion.txt

          echo "Checking unresolved merge markers..."
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- \
            '*.meta' '*.asset' '*.prefab' '*.unity' '*.cs' '*.json' '*.yml' '*.yaml'; then
            echo "::error::Unresolved Git merge markers were found in the repository."
            exit 1
          fi

          echo "Checking repository status..."
          git status --short

          echo "Repository preflight passed."

      # ------------------------------------------------------------
      # 4. Configure Docker nofile limit
      #
      # Unity/Bee crashed with:
      # Requested file descriptor exceeds maximum number of files
      #
      # GameCI unity-builder@v4 does not expose a nofile input, so
      # configure Docker's default ulimit before GameCI starts its
      # Unity container.
      # ------------------------------------------------------------
      - name: Increase Docker file descriptor limit
        shell: bash
        run: |
          set -euo pipefail

          echo "Host open-file limit:"
          ulimit -n || true
          cat /proc/self/limits | grep -i "open files" || true

          sudo mkdir -p /etc/docker

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("/etc/docker/daemon.json")

          if path.exists():
              try:
                  data = json.loads(path.read_text())
                  if not isinstance(data, dict):
                      data = {}
              except Exception:
                  data = {}
          else:
              data = {}

          data["default-ulimits"] = {
              "nofile": {
                  "Name": "nofile",
                  "Soft": 262144,
                  "Hard": 262144
              }
          }

          path.write_text(json.dumps(data, indent=2) + "\n")
          print(path.read_text())
          PY

          sudo systemctl restart docker

          echo "Docker open-file limit:"
          docker info >/dev/null

          docker run --rm ubuntu:24.04 bash -c '
            echo "Container ulimit:"
            ulimit -n
            echo "Container /proc limit:"
            cat /proc/self/limits | grep -i "open files"
          '

      # ------------------------------------------------------------
      # 5. Cache Unity Library
      # ------------------------------------------------------------
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-2022.3.62f3-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-2022.3.62f3-

      # ------------------------------------------------------------
      # 6. Clean Bee after restoring Library cache
      # ------------------------------------------------------------
      - name: Clean Unity Bee cache
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing Library/Bee to avoid stale/corrupt Bee DAG data..."
          rm -rf Library/Bee

          echo "Remaining Library size:"
          du -sh Library 2>/dev/null || true

          echo "Disk:"
          df -h

      # ------------------------------------------------------------
      # 7. Check resources immediately before Unity
      # ------------------------------------------------------------
      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Open files ==="
          ulimit -n || true
          cat /proc/self/limits | grep -i "open files" || true

          echo "=== Memory ==="
          free -h

          echo "=== Disk ==="
          df -h

          echo "=== Docker ==="
          docker version --format '{{.Server.Version}}'

      # ------------------------------------------------------------
      # 8. Build Unity Windows x64
      #
      # IMPORTANT:
      # - No Unity Test Runner here.
      # - unity-tests.yml remains separate.
      # - Custom CIBuilder is preserved.
      # ------------------------------------------------------------
      - name: Build Addressables and Windows x64 player
        id: unity-build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f3
          targetPlatform: StandaloneWindows64
          buildsPath: build
          buildName: DuskBlade
          buildMethod: DuskBlade.Editor.CI.CIBuilder.BuildWindows
          collectUnityLogs: true
          streamUnityLogs: true

      # ------------------------------------------------------------
      # 9. Verify build output
      # ------------------------------------------------------------
      - name: Verify Windows build
        shell: bash
        run: |
          set -euo pipefail

          echo "Build directory:"
          find build -maxdepth 4 -type f -printf '%p (%s bytes)\n' | sort || true

          BUILD_ROOT="build/StandaloneWindows64"

          if [ ! -d "$BUILD_ROOT" ]; then
            echo "::error::Windows build directory not found: $BUILD_ROOT"
            exit 1
          fi

          if [ ! -f "$BUILD_ROOT/DuskBlade.exe" ]; then
            echo "::error::DuskBlade.exe was not found."
            exit 1
          fi

          if [ ! -d "$BUILD_ROOT/DuskBlade_Data" ]; then
            echo "::error::DuskBlade_Data was not found."
            exit 1
          fi

          if [ ! -f "$BUILD_ROOT/UnityPlayer.dll" ]; then
            echo "::error::UnityPlayer.dll was not found."
            exit 1
          fi

          if [ ! -d "$BUILD_ROOT/MonoBleedingEdge" ]; then
            echo "::error::MonoBleedingEdge was not found."
            exit 1
          fi

          echo "Windows build verification passed."

      # ------------------------------------------------------------
      # 10. Upload raw build artifact
      # ------------------------------------------------------------
      - name: Upload Windows build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DuskBlade-Windows-x64
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      # ------------------------------------------------------------
      # 11. Package ZIP
      # ------------------------------------------------------------
      - name: Package Windows build
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cd build/StandaloneWindows64
          zip -r ../../release/DuskBlade-Windows-x64.zip .
          cd ../..

          echo "Release package:"
          ls -lh release/DuskBlade-Windows-x64.zip

      # ------------------------------------------------------------
      # 12. Upload ZIP artifact
      # ------------------------------------------------------------
      - name: Upload Windows ZIP artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DuskBlade-Windows-x64-ZIP
          path: release/DuskBlade-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # ------------------------------------------------------------
      # 13. Upload Unity diagnostics even when build fails
      # ------------------------------------------------------------
      - name: Upload Unity diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-diagnostics
          path: Logs/UnityDiagnostics/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

      # ------------------------------------------------------------
      # 14. Create GitHub prerelease
      #
      # Push to main:
      #   -> prerelease is created automatically.
      #
      # Manual workflow_dispatch:
      #   -> prerelease is created only when publish_release=true.
      # ------------------------------------------------------------
      - name: Create GitHub prerelease
        if: >
          success() &&
          (
            github.event_name == 'push' ||
            inputs.publish_release == true
          )
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="build-${GITHUB_RUN_NUMBER}"
          TITLE="DuskBlade Build ${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            release/DuskBlade-Windows-x64.zip \
            --title "$TITLE" \
            --prerelease \
            --generate-notes
