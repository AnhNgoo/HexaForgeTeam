name: Unity Test Runner

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show branch
        run: |
          git branch
          git log -1

      # ========================================
      # CACHE
      # ========================================
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # ========================================
      # FREE DISK SPACE
      # ========================================
      - name: Free disk space for Unity Docker image
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/microsoft || true

          sudo apt-get clean
          docker system prune -af || true

          echo "Disk space after cleanup:"
          df -h

      # ========================================
      # PREPARE CSV
      # ========================================
      - name: Prepare clean CSV report directory
        shell: bash
        run: |
          rm -rf Assets/CSV
          mkdir -p Assets/CSV

      # ========================================
      # EDITMODE
      # ========================================
      - name: Run Unity EditMode tests
        id: unity-editmode
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4

        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

        with:
          projectPath: .
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results
          customImage: unityci/editor:ubuntu-2022.3.62f3-base-3
          testMode: editmode
          artifactsPath: test-results/editmode

      # ========================================
      # PLAYMODE
      # ALWAYS RUN EVEN IF EDITMODE FAILS
      # ========================================
      - name: Run Unity PlayMode tests
        id: unity-playmode
        if: ${{ always() }}
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4

        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

        with:
          projectPath: .
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode Test Results
          customImage: unityci/editor:ubuntu-2022.3.62f3-base-3
          testMode: playmode
          artifactsPath: test-results/playmode

      # ========================================
      # LIST RESULTS
      # ========================================
      - name: List generated test artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          echo "===== TEST RESULTS ====="
          find test-results -maxdepth 4 -type f -print || true

          echo ""
          echo "===== CSV REPORTS ====="
          find Assets/CSV -maxdepth 1 -type f -print || true

      # ========================================
      # SUMMARY
      # ========================================
      - name: Write Unity test summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Unity Test Runner"
            echo ""
            echo "### Results"
            echo ""
            echo "| Test Mode | Outcome |"
            echo "|---|---|"
            echo "| EditMode | ${{ steps.unity-editmode.outcome }} |"
            echo "| PlayMode | ${{ steps.unity-playmode.outcome }} |"
            echo ""
            echo "Test reports are uploaded as artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      # ========================================
      # UPLOAD CSV
      # ========================================
      - name: Upload CSV test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: duskblade-csv-test-reports
          path: Assets/CSV/*.csv
          if-no-files-found: ignore

      # ========================================
      # UPLOAD UNITY RESULTS
      # ========================================
      - name: Upload Unity Test Results Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: test-results
          if-no-files-found: ignore
