name: Unity Test Runner

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - develop
      - demofromphuocbranch
      - testrunner
      - feat/testrunner

  pull_request:
    branches:
      - main
      - develop
      - testrunner
      - feat/testrunner

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Free disk space for Unity Docker image
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/microsoft || true
          sudo apt-get clean
          docker system prune -af || true

          echo "Disk space after cleanup:"
          df -h

      - name: Prepare clean CSV report directory
        shell: bash
        run: |
          rm -rf Assets/CSV
          mkdir -p Assets/CSV

      - name: Run Unity EditMode tests
        id: unity-editmode
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          customImage: unityci/editor:ubuntu-2022.3.62f3-base-3
          testMode: editmode
          artifactsPath: test-results/editmode

      - name: Run Unity PlayMode tests
        id: unity-playmode
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          customImage: unityci/editor:ubuntu-2022.3.62f3-base-3
          testMode: playmode
          artifactsPath: test-results/playmode

      - name: List generated test artifacts
        if: always()
        shell: bash
        run: |
          find test-results -maxdepth 3 -type f -print || true
          find Assets/CSV -maxdepth 1 -type f -print || true

      - name: Write Unity test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Unity Test Runner"
            echo ""
            echo "- EditMode outcome: ${{ steps.unity-editmode.outcome }}"
            echo "- PlayMode outcome: ${{ steps.unity-playmode.outcome }}"
            echo ""
            echo "This workflow uploads reports for review and does not block merging when Unity tests fail."
            echo "Download artifacts 'unity-test-results' and 'duskblade-csv-test-reports' to inspect failed tests."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare CSV reports without metadata
        if: always()
        shell: bash
        run: |
          mkdir -p Assets/CSV_CLEAN
          find Assets/CSV -type f -name '*.csv' -exec cp {} Assets/CSV_CLEAN/ \;

      - name: Upload CSV test reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: duskblade-csv-test-reports
          path: Assets/CSV_CLEAN/*.csv
          if-no-files-found: ignore

      - name: Upload CSV test reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: duskblade-csv-test-reports
          path: Assets/CSV/*.csv
          if-no-files-found: ignore
